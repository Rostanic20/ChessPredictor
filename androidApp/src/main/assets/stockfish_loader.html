<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:,">
    <title>Stockfish</title>
</head>
<body>
<script>
    var engine = null;

    function sendCommand(cmd) {
        if (engine) engine.postMessage(cmd);
    }

    window.onload = function () {
        try {
            engine = new Worker('stockfish.js');
            engine.onmessage = function (event) {
                var line = String(event.data);
                Android.onMessage(line);
                if (line === 'uciok') Android.onReady();
            };
            engine.onerror = function (event) {
                Android.onError('Worker error: ' + (event.message || 'unknown'));
            };
            engine.postMessage('uci');
        } catch (e) {
            Android.onError('Init error: ' + e.message);
        }
    };
</script>
</body>
</html>
